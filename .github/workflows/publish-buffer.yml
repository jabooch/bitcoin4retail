name: Publish Bitcoin4Retail Social

on:
  push:
    branches: [main]
    paths:
      - "social/publish/*.json"
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path to a publish manifest JSON file"
        required: true
        default: "social/publish/latest.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve manifest path
        id: manifest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ inputs.manifest_path }}"
          else
            FILE="$(git diff --name-only HEAD^ HEAD | grep -E '^social/publish/[^/]+\.json$' | tail -n 1 || true)"
          fi

          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "No publish manifest found."
            exit 1
          fi

          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Validate manifest approval
        shell: bash
        run: |
          FILE="${{ steps.manifest.outputs.path }}"
          jq -e '.approved == true' "$FILE" >/dev/null || {
            echo "Manifest is not approved for publishing."
            exit 1
          }
          jq -e '.posts | type == "array" and length > 0' "$FILE" >/dev/null || {
            echo "Manifest has no posts."
            exit 1
          }

      - name: Render and publish media to site
        id: render
        shell: bash
        run: |
          FILE="${{ steps.manifest.outputs.path }}"
          DATE="$(jq -r '.render.date // .date' "$FILE")"
          python3 scripts/render_social.py "$FILE"
          test -f "media/social/$DATE/vertical.mp4"
          test -f "media/social/$DATE/x.jpg"
          git config user.name "bitcoin4retail-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "media/social/$DATE/vertical.mp4" "media/social/$DATE/x.jpg"
          if ! git diff --cached --quiet; then
            git commit -m "Render social media for $DATE"
            git push origin HEAD:main
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Prepare public media URLs
        shell: bash
        run: |
          FILE="${{ steps.manifest.outputs.path }}"
          DATE="${{ steps.render.outputs.date }}"
          BASE="https://www.bitcoin4retail.com/media/social/$DATE"
          jq --arg vertical "$BASE/vertical.mp4" '
            .posts |= map(
              if (.service=="instagram" or .service=="tiktok" or .service=="youtube")
              then .media=[{"type":"video","url":$vertical}]
              else . end
            )
          ' "$FILE" > /tmp/prepared-manifest.json

      - name: Wait for deployed media
        shell: bash
        run: |
          DATE="${{ steps.render.outputs.date }}"
          URL="https://www.bitcoin4retail.com/media/social/$DATE/vertical.mp4"
          for i in $(seq 1 30); do
            if curl -fsSI "$URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Media deployment timed out."
          exit 1

      - name: Buffer dry run
        env:
          B4R_AUTOMATION_SECRET: ${{ secrets.B4R_AUTOMATION_SECRET }}
        shell: bash
        run: |
          jq '.dryRun = true | {dryRun, organizationId, posts}' /tmp/prepared-manifest.json > /tmp/dry-run.json
          curl --fail-with-body --silent --show-error \
            -X POST "https://www.bitcoin4retail.com/api/buffer/publish" \
            -H "Authorization: Bearer $B4R_AUTOMATION_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/dry-run.json \
            | tee /tmp/dry-run-result.json

      - name: Validate Buffer preflight
        shell: bash
        run: |
          EXPECTED="$(jq '.posts | length' /tmp/prepared-manifest.json)"
          jq -e --argjson expected "$EXPECTED" '
            .ok == true and
            .dryRun == true and
            (.prepared | length) == $expected
          ' /tmp/dry-run-result.json >/dev/null || {
            echo "Buffer dry run did not prepare all requested posts."
            cat /tmp/dry-run-result.json
            exit 1
          }

      - name: Check test-only mode
        id: mode
        shell: bash
        run: |
          TEST_ONLY="$(jq -r '.testOnly // false' /tmp/prepared-manifest.json)"
          echo "test_only=$TEST_ONLY" >> "$GITHUB_OUTPUT"

      - name: Publish approved package
        if: steps.mode.outputs.test_only != 'true'
        env:
          B4R_AUTOMATION_SECRET: ${{ secrets.B4R_AUTOMATION_SECRET }}
        shell: bash
        run: |
          jq '.dryRun = false | {dryRun, organizationId, posts}' /tmp/prepared-manifest.json > /tmp/publish.json
          curl --fail-with-body --silent --show-error \
            -X POST "https://www.bitcoin4retail.com/api/buffer/publish" \
            -H "Authorization: Bearer $B4R_AUTOMATION_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/publish.json \
            | tee /tmp/buffer-result.json
